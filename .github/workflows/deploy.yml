name: Aanbiedingen ophalen en site publiceren
on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publiceer:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment2.outputs.page_url || steps.deployment3.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Haal aanbiedingen op
        run: node sync.mjs
        env:
          PRIJSPROFEET_API_KEY: ${{ secrets.PRIJSPROFEET_API_KEY }}
      - name: Haal Roastmarket op (advertentieblok; mag mislukken, dan blijft het blok weg)
        continue-on-error: true
        run: node feed-roastmarket.mjs
        env:
          ROASTMARKET_FEED_URL: ${{ secrets.ROASTMARKET_FEED_URL }}
      - name: Bouw de site (alle pagina's; deals.json komt nergens in git)
        run: |
          mkdir _site
          cp deals.json robots.txt f9653690eb8d828652b2a85679de7801.txt _site/
          cp *.svg *.png _site/
          node build.mjs _site
      - name: Bewaar het geheugen van de vaste adressen (reservekopie, 90 dagen)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: paginas-geheugen
          path: _site/paginas.json
          retention-days: 90
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      # Publiceren mislukt soms door een storing bij GitHub ("Fetching artifact metadata failed").
      # Dan na 1 en na 3 minuten opnieuw proberen met hetzelfde pakket, in plaats van de hele update te laten mislukken.
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Even wachten (storing bij GitHub)
        if: steps.deployment.outcome == 'failure'
        run: sleep 60
      - id: deployment2
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Nog even wachten (storing bij GitHub)
        if: steps.deployment.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        run: sleep 180
      - id: deployment3
        if: steps.deployment.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        uses: actions/deploy-pages@v4
      - name: Laat Bing weten dat er nieuwe pagina's zijn
        continue-on-error: true
        run: node indexnow.mjs
